<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEWS NOW</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --background: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --sub-text: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --hover: #f3f4f6;
      --danger: #ef4444;
      --shadow: 0 4px 18px rgba(0, 0, 0, 0.07);
    }

    body.dark {
      --background: #111827;
      --card: #1f2937;
      --text: #f9fafb;
      --sub-text: #9ca3af;
      --border: #374151;
      --primary: #60a5fa;
      --primary-light: #1e3a5f;
      --hover: #374151;
      --shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--background);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
      transition:
        background 0.25s ease,
        color 0.25s ease;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .header-inner {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    .logo span {
      color: var(--primary);
    }

    .header-status {
      color: var(--sub-text);
      font-size: 13px;
    }

    main {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding-top: 28px;
    }

    .page {
      display: block;
    }

    .hidden {
      display: none !important;
    }

    .search-area {
      margin-bottom: 16px;
    }

    .search-box {
      width: 100%;
      height: 48px;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0 16px;
      background: var(--card);
      color: var(--text);
      outline: none;
      box-shadow: var(--shadow);
    }

    .search-box:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .top-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .small-button,
    .secondary-button,
    .primary-button,
    .update-button {
      border: 0;
      border-radius: 10px;
      padding: 10px 15px;
      font-weight: 700;
      transition:
        transform 0.15s ease,
        opacity 0.15s ease,
        background 0.15s ease;
    }

    .small-button,
    .secondary-button {
      background: var(--hover);
      color: var(--text);
    }

    .primary-button,
    .update-button {
      background: var(--primary);
      color: #ffffff;
    }

    button:hover {
      opacity: 0.88;
    }

    button:active {
      transform: scale(0.97);
    }

    .category-area {
      margin-bottom: 28px;
    }

    .category-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .categories {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .category-button {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 15px;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .category-button:hover {
      background: var(--hover);
    }

    .category-button.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .top-area {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 8px;
    }

    .page-title {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .update-info {
      color: var(--sub-text);
      font-size: 13px;
      margin-bottom: 16px;
    }

    .status {
      padding: 12px 15px;
      border-radius: 12px;
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .news-list,
    .popular-area {
      display: grid;
      gap: 14px;
    }

    .news-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--shadow);
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }

    .news-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.09);
    }

    .news-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
      color: var(--sub-text);
      font-size: 12px;
    }

    .news-category {
      color: var(--primary);
      font-weight: 800;
    }

    .news-title {
      margin: 0 0 10px;
      font-size: 19px;
      line-height: 1.5;
      font-weight: 850;
    }

    .news-description {
      color: var(--sub-text);
      line-height: 1.7;
      font-size: 14px;
      margin-bottom: 14px;
    }

    .news-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .news-source {
      color: var(--sub-text);
      font-size: 12px;
    }

    .action-group {
      display: flex;
      gap: 8px;
    }

    .icon-button {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 9px;
      padding: 8px 11px;
      font-size: 13px;
      font-weight: 700;
    }

    .icon-button.favorite-active {
      color: #f59e0b;
      border-color: #f59e0b;
    }

    .detail-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .detail-category {
      color: var(--primary);
      font-weight: 800;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .detail-title {
      margin: 0 0 12px;
      font-size: 30px;
      line-height: 1.45;
    }

    .detail-date {
      color: var(--sub-text);
      font-size: 13px;
      margin-bottom: 22px;
    }

    .detail-description {
      color: var(--sub-text);
      line-height: 1.9;
      font-size: 15px;
      white-space: pre-wrap;
    }

    .detail-link {
      display: inline-block;
      margin-top: 22px;
      padding: 11px 16px;
      border-radius: 10px;
      background: var(--primary);
      color: #ffffff;
      text-decoration: none;
      font-weight: 800;
    }

    .empty {
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: 16px;
      padding: 35px 20px;
      text-align: center;
      color: var(--sub-text);
    }

    .notification-panel {
      position: fixed;
      top: 82px;
      right: 20px;
      width: min(360px, calc(100% - 40px));
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.18);
      padding: 18px;
      z-index: 100;
      display: none;
    }

    .notification-panel.show {
      display: block;
    }

    .notification-title {
      font-weight: 900;
      margin-bottom: 8px;
    }

    .notification-text {
      color: var(--sub-text);
      line-height: 1.6;
      font-size: 14px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 80;
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      backdrop-filter: blur(12px);
    }

    .bottom-nav-inner {
      width: min(600px, calc(100% - 20px));
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .nav-button {
      position: relative;
      border: 0;
      background: transparent;
      color: var(--sub-text);
      padding: 9px 4px 7px;
      font-size: 12px;
      font-weight: 800;
      border-radius: 10px;
    }

    .nav-button.active {
      color: var(--primary);
      background: var(--primary-light);
    }

    .nav-line {
      display: block;
      width: 22px;
      height: 3px;
      margin: 0 auto 5px;
      border-radius: 99px;
      background: transparent;
    }

    .nav-button.active .nav-line {
      background: var(--primary);
    }

    .popular-number {
      font-size: 24px;
      font-weight: 900;
      color: var(--primary);
      margin-right: 10px;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: var(--sub-text);
    }

    .error-box {
      padding: 18px;
      border-radius: 12px;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      line-height: 1.6;
    }

    body.dark .error-box {
      background: #451a1a;
      color: #fecaca;
      border-color: #7f1d1d;
    }

    @media (max-width: 700px) {
      main {
        width: min(100% - 20px, 1100px);
        padding-top: 18px;
      }

      .header-inner {
        width: calc(100% - 20px);
        min-height: 60px;
      }

      .logo {
        font-size: 20px;
      }

      .header-status {
        display: none;
      }

      .top-area {
        align-items: flex-start;
        flex-direction: column;
      }

      .page-title {
        font-size: 23px;
      }

      .update-button {
        width: 100%;
      }

      .detail-title {
        font-size: 23px;
      }

      .detail-card {
        padding: 18px;
      }

      .news-title {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header class="header">
      <div class="header-inner">

        <div class="logo">
          NEWS <span>NOW</span>
        </div>

        <div class="header-status" id="headerStatus">
          最新ニュースを表示中
        </div>

      </div>
    </header>

    <main>

      <!-- ホーム -->
      <section id="homePage" class="page">

        <div class="search-area">
          <input
            type="text"
            id="searchInput"
            class="search-box"
            placeholder="ニュースを検索"
            autocomplete="off"
          >
        </div>

        <div class="top-buttons">

          <button
            id="darkModeButton"
            class="small-button"
            type="button"
          >
            ダークモード
          </button>

          <button
            id="notificationButton"
            class="small-button"
            type="button"
          >
            通知を確認
          </button>

        </div>

        <section class="category-area">

          <div class="category-title">
            ニュースジャンル
          </div>

          <div class="categories">

            <button
              class="category-button active"
              data-category="総合"
              type="button"
            >
              総合
            </button>

            <button
              class="category-button"
              data-category="国内"
              type="button"
            >
              国内
            </button>

            <button
              class="category-button"
              data-category="海外"
              type="button"
            >
              海外
            </button>

            <button
              class="category-button"
              data-category="IT"
              type="button"
            >
              IT・テクノロジー
            </button>

            <button
              class="category-button"
              data-category="スポーツ"
              type="button"
            >
              スポーツ
            </button>

            <button
              class="category-button"
              data-category="エンタメ"
              type="button"
            >
              エンタメ
            </button>

            <button
              class="category-button"
              data-category="科学"
              type="button"
            >
              科学
            </button>

          </div>

        </section>

        <div class="top-area">

          <div
            class="page-title"
            id="currentCategory"
          >
            総合ニュース
          </div>

          <button
            class="update-button"
            id="updateButton"
            type="button"
          >
            ニュースを更新
          </button>

        </div>

        <div
          id="updateInfo"
          class="update-info"
        >
          最新ニュースを読み込んでいます
        </div>

        <div
          id="status"
          class="status"
        >
          ニュースを読み込んでいます
        </div>

        <div
          id="newsList"
          class="news-list"
        ></div>

      </section>


      <!-- 注目 -->
      <section
        id="popularPage"
        class="page hidden"
      >

        <div class="page-title">
          注目ニュース
        </div>

        <p class="update-info">
          現在表示されているニュースから注目の記事を表示しています
        </p>

        <div
          id="popularList"
          class="popular-area"
        ></div>

      </section>


      <!-- お気に入り -->
      <section
        id="favoritesPage"
        class="page hidden"
      >

        <div class="page-title">
          お気に入り
        </div>

        <div
          id="favoritesList"
          class="news-list"
          style="margin-top: 20px;"
        ></div>

      </section>


      <!-- 詳細 -->
      <section
        id="detailPage"
        class="page hidden"
      >

        <button
          id="backButton"
          class="secondary-button"
          style="margin-bottom: 18px;"
          type="button"
        >
          戻る
        </button>

        <article
          id="detailContent"
          class="detail-card"
        ></article>

      </section>


      <!-- 設定 -->
      <section
        id="settingsPage"
        class="page hidden"
      >

        <div class="page-title">
          設定
        </div>

        <div
          class="detail-card"
          style="margin-top: 20px;"
        >

          <div
            style="
              font-weight: bold;
              margin-bottom: 10px;
            "
          >
            NEWS NOWについて
          </div>

          <div class="detail-description">
            NEWS NOWは複数のニュースをまとめて確認するためのニュースサイトです。
          </div>

          <button
            id="settingsDarkButton"
            class="primary-button"
            type="button"
            style="margin-top: 18px;"
          >
            ダークモードを切り替える
          </button>

        </div>

      </section>

    </main>


    <!-- 通知 -->
    <div
      id="notificationPanel"
      class="notification-panel"
    >

      <div class="notification-title">
        通知
      </div>

      <div
        id="notificationText"
        class="notification-text"
      >
        現在、新しい通知はありません。
      </div>

    </div>


    <!-- 下部ナビ -->
    <nav class="bottom-nav">

      <div class="bottom-nav-inner">

        <button
          class="nav-button active"
          data-page="home"
          type="button"
        >
          <span class="nav-line"></span>
          ホーム
        </button>

        <button
          class="nav-button"
          data-page="popular"
          type="button"
        >
          <span class="nav-line"></span>
          注目
        </button>

        <button
          class="nav-button"
          data-page="favorites"
          type="button"
        >
          <span class="nav-line"></span>
          お気に入り
        </button>

        <button
          class="nav-button"
          data-page="settings"
          type="button"
        >
          <span class="nav-line"></span>
          設定
        </button>

      </div>

    </nav>

  </div>


  <script>
    /*
     * NEWS NOW
     * 完全版 JavaScript
     *
     * 現在はサンプルニュースを使用しています。
     * 実際のニュースAPIを接続する場合は
     * loadNews() の部分をAPI取得処理に置き換えてください。
     */

    const sampleNews = [
      {
        id: 1,
        category: "国内",
        title: "国内で注目を集めている最新ニュース",
        description: "国内で話題となっているニュースをNEWS NOWが分かりやすくまとめています。",
        source: "NEWS NOW編集部",
        date: "2026-09-04 07:00",
        url: "#"
      },
      {
        id: 2,
        category: "IT",
        title: "IT・テクノロジー分野で新しい動き",
        description: "テクノロジーに関する最新の動きを紹介しています。新しいサービスや技術に注目です。",
        source: "NEWS NOW編集部",
        date: "2026-09-04 06:30",
        url: "#"
      },
      {
        id: 3,
        category: "スポーツ",
        title: "スポーツ界で注目のニュース",
        description: "スポーツに関する最新情報をまとめています。",
        source: "NEWS NOW編集部",
        date: "2026-09-04 06:00",
        url: "#"
      },
      {
        id: 4,
        category: "海外",
        title: "海外から届いた最新ニュース",
        description: "海外で報じられている注目ニュースを紹介しています。",
        source: "NEWS NOW編集部",
        date: "2026-09-04 05:30",
        url: "#"
      },
      {
        id: 5,
        category: "エンタメ",
        title: "エンタメ業界の最新ニュース",
        description: "映画、音楽、テレビなど、エンタメ分野の注目ニュースです。",
        source: "NEWS NOW編集部",
        date: "2026-09-04 05:00",
        url: "#"
      },
      {
        id: 6,
        category: "科学",
        title: "科学分野で注目される新しい発見",
        description: "科学に関する最新の研究や発見について紹介しています。",
        source: "NEWS NOW編集部",
        date: "2026-09-04 04:30",
        url: "#"
      },
      {
        id: 7,
        category: "国内",
        title: "今知っておきたい国内のニュース",
        description: "国内の最新情報をまとめて確認できます。",
        source: "NEWS NOW編集部",
        date: "2026-09-04 04:00",
        url: "#"
      },
      {
        id: 8,
        category: "IT",
        title: "スマートフォンやネットに関する最新情報",
        description: "スマートフォンやインターネットに関するニュースを紹介します。",
        source: "NEWS NOW編集部",
        date: "2026-09-04 03:30",
        url: "#"
      }
    ];


    let newsData = [...sampleNews];

    let currentCategory = "総合";

    let favorites = JSON.parse(
      localStorage.getItem("newsNowFavorites") || "[]"
    );


    const homePage =
      document.getElementById("homePage");

    const popularPage =
      document.getElementById("popularPage");

    const favoritesPage =
      document.getElementById("favoritesPage");

    const detailPage =
      document.getElementById("detailPage");

    const settingsPage =
      document.getElementById("settingsPage");

    const newsList =
      document.getElementById("newsList");

    const popularList =
      document.getElementById("popularList");

    const favoritesList =
      document.getElementById("favoritesList");

    const detailContent =
      document.getElementById("detailContent");

    const searchInput =
      document.getElementById("searchInput");

    const status =
      document.getElementById("status");

    const updateInfo =
      document.getElementById("updateInfo");

    const currentCategoryElement =
      document.getElementById("currentCategory");

    const headerStatus =
      document.getElementById("headerStatus");

    const notificationPanel =
      document.getElementById("notificationPanel");


    function escapeHTML(value) {
      const div = document.createElement("div");
      div.textContent = value ?? "";
      return div.innerHTML;
    }


    function saveFavorites() {
      localStorage.setItem(
        "newsNowFavorites",
        JSON.stringify(favorites)
      );
    }


    function isFavorite(id) {
      return favorites.includes(id);
    }


    function toggleFavorite(id) {

      if (isFavorite(id)) {

        favorites = favorites.filter(
          favoriteId => favoriteId !== id
        );

      } else {

        favorites.push(id);

      }

      saveFavorites();

      renderNews();
      renderPopular();
      renderFavorites();
    }


    function getFilteredNews() {

      const keyword =
        searchInput.value
          .trim()
          .toLowerCase();

      let result = [...newsData];


      if (currentCategory !== "総合") {

        result = result.filter(
          news => news.category === currentCategory
        );

      }


      if (keyword) {

        result = result.filter(news => {

          const text = (
            news.title +
            " " +
            news.description +
            " " +
            news.category +
            " " +
            news.source
          ).toLowerCase();

          return text.includes(keyword);

        });

      }


      return result;
    }


    function createNewsCard(news) {

      const favorite =
        isFavorite(news.id);

      return `
        <article class="news-card">

          <div class="news-meta">

            <span class="news-category">
              ${escapeHTML(news.category)}
            </span>

            <span>
              ${escapeHTML(news.date)}
            </span>

          </div>

          <h2 class="news-title">
            ${escapeHTML(news.title)}
          </h2>

          <div class="news-description">
            ${escapeHTML(news.description)}
          </div>

          <div class="news-actions">

            <div class="news-source">
              ${escapeHTML(news.source)}
            </div>

            <div class="action-group">

              <button
                class="icon-button ${favorite ? "favorite-active" : ""}"
                type="button"
                onclick="toggleFavorite(${news.id})"
              >
                ${favorite ? "★ お気に入り済み" : "☆ お気に入り"}
              </button>

              <button
                class="icon-button"
                type="button"
                onclick="openDetail(${news.id})"
              >
                詳細
              </button>

            </div>

          </div>

        </article>
      `;
    }


    function renderNews() {

      const filtered =
        getFilteredNews();


      if (filtered.length === 0) {

        newsList.innerHTML = `
          <div class="empty">
            条件に一致するニュースがありません。
          </div>
        `;

        status.textContent =
          "ニュースが見つかりませんでした";

        return;
      }


      newsList.innerHTML =
        filtered
          .map(createNewsCard)
          .join("");


      status.textContent =
        `${filtered.length}件のニュースを表示中`;

    }


    function renderPopular() {

      const sorted =
        [...newsData]
          .sort((a, b) => b.id - a.id)
          .slice(0, 5);


      if (sorted.length === 0) {

        popularList.innerHTML = `
          <div class="empty">
            注目ニュースはありません。
          </div>
        `;

        return;
      }


      popularList.innerHTML =
        sorted
          .map((news, index) => {

            return `
              <article class="news-card">

                <div style="display:flex;align-items:flex-start;">

                  <div class="popular-number">
                    ${index + 1}
                  </div>

                  <div style="flex:1;">

                    <div class="news-meta">

                      <span class="news-category">
                        ${escapeHTML(news.category)}
                      </span>

                      <span>
                        ${escapeHTML(news.date)}
                      </span>

                    </div>

                    <h2 class="news-title">
                      ${escapeHTML(news.title)}
                    </h2>

                    <div class="news-description">
                      ${escapeHTML(news.description)}
                    </div>

                    <button
                      class="icon-button"
                      type="button"
                      onclick="openDetail(${news.id})"
                    >
                      記事を見る
                    </button>

                  </div>

                </div>

              </article>
            `;

          })
          .join("");
    }


    function renderFavorites() {

      const favoriteNews =
        newsData.filter(
          news => favorites.includes(news.id)
        );


      if (favoriteNews.length === 0) {

        favoritesList.innerHTML = `
          <div class="empty">
            <div style="font-size:32px;margin-bottom:10px;">
              ☆
            </div>

            <div style="font-weight:800;margin-bottom:6px;">
              お気に入りはありません
            </div>

            <div>
              気になるニュースをお気に入りに追加すると、ここから確認できます。
            </div>
          </div>
        `;

        return;
      }


      favoritesList.innerHTML =
        favoriteNews
          .map(createNewsCard)
          .join("");
    }


    function openDetail(id) {

      const news =
        newsData.find(
          item => item.id === id
        );


      if (!news) {
        return;
      }


      detailContent.innerHTML = `

        <div class="detail-category">
          ${escapeHTML(news.category)}
        </div>

        <h1 class="detail-title">
          ${escapeHTML(news.title)}
        </h1>

        <div class="detail-date">
          ${escapeHTML(news.source)}
          ・
          ${escapeHTML(news.date)}
        </div>

        <div class="detail-description">
          ${escapeHTML(news.description)}
        </div>

        ${
          news.url && news.url !== "#"
            ? `
              <a
                class="detail-link"
                href="${escapeHTML(news.url)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                元の記事を読む
              </a>
            `
            : ""
        }

        <div style="margin-top:18px;">

          <button
            class="icon-button ${isFavorite(news.id) ? "favorite-active" : ""}"
            type="button"
            onclick="toggleFavorite(${news.id})"
          >
            ${
              isFavorite(news.id)
                ? "★ お気に入り済み"
                : "☆ お気に入りに追加"
            }
          </button>

        </div>
      `;


      showPage("detail");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }


    function showPage(pageName) {

      const pages = {
        home: homePage,
        popular: popularPage,
        favorites: favoritesPage,
        detail: detailPage,
        settings: settingsPage
      };


      Object.values(pages).forEach(page => {

        page.classList.add("hidden");

      });


      if (pages[pageName]) {

        pages[pageName]
          .classList.remove("hidden");

      }


      document
        .querySelectorAll(".nav-button")
        .forEach(button => {

          button.classList.remove("active");

        });


      const activeButton =
        document.querySelector(
          `.nav-button[data-page="${pageName}"]`
        );


      if (activeButton) {

        activeButton.classList.add("active");

      }


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }


    function setCategory(category) {

      currentCategory = category;

      currentCategoryElement.textContent =
        category === "総合"
          ? "総合ニュース"
          : `${category}ニュース`;


      document
        .querySelectorAll(".category-button")
        .forEach(button => {

          button.classList.toggle(
            "active",
            button.dataset.category === category
          );

        });


      renderNews();


      showPage("home");
    }


    async function loadNews() {

      status.textContent =
        "ニュースを読み込んでいます";

      updateInfo.textContent =
        "最新ニュースを確認しています";


      await new Promise(
        resolve => setTimeout(resolve, 500)
      );


      /*
       * 現在はサンプルニュースを使用。
       *
       * 本物のニュースAPIを利用する場合は、
       * この部分でfetch()などを使用して
       * APIからニュースを取得します。
       */


      newsData = [...sampleNews];


      renderNews();
      renderPopular();
      renderFavorites();


      const now =
        new Date();


      const formatted =
        now.toLocaleString(
          "ja-JP",
          {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
          }
        );


      updateInfo.textContent =
        `最終更新：${formatted}`;

      headerStatus.textContent =
        `${newsData.length}件のニュースを表示中`;

    }


    function toggleDarkMode() {

      document.body.classList.toggle("dark");


      const dark =
        document.body.classList.contains("dark");


      localStorage.setItem(
        "newsNowDarkMode",
        dark ? "true" : "false"
      );


      updateDarkModeButtons();

    }


    function updateDarkModeButtons() {

      const dark =
        document.body.classList.contains("dark");


      const buttons =
        [
          document.getElementById("darkModeButton"),
          document.getElementById("settingsDarkButton")
        ];


      buttons.forEach(button => {

        if (!button) {
          return;
        }

        button.textContent =
          dark
            ? "ライトモードに切り替える"
            : "ダークモードに切り替える";

      });

    }


    function loadDarkMode() {

      const dark =
        localStorage.getItem(
          "newsNowDarkMode"
        ) === "true";


      if (dark) {

        document.body.classList.add("dark");

      }


      updateDarkModeButtons();
    }


    function showNotification() {

      const favoriteCount =
        favorites.length;


      const notificationText =
        document.getElementById(
          "notificationText"
        );


      if (favoriteCount > 0) {

        notificationText.textContent =
          `現在、お気に入りに${favoriteCount}件の記事があります。`;

      } else {

        notificationText.textContent =
          "現在、新しい通知はありません。";

      }


      notificationPanel.classList.toggle(
        "show"
      );

    }


    document
      .querySelectorAll(".category-button")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            setCategory(
              button.dataset.category
            );

          }
        );

      });


    document
      .querySelectorAll(".nav-button")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            showPage(
              button.dataset.page
            );

            if (
              button.dataset.page === "popular"
            ) {
              renderPopular();
            }

            if (
              button.dataset.page === "favorites"
            ) {
              renderFavorites();
            }

          }
        );

      });


    searchInput.addEventListener(
      "input",
      () => {

        renderNews();

      }
    );


    document
      .getElementById("updateButton")
      .addEventListener(
        "click",
        loadNews
      );


    document
      .getElementById("darkModeButton")
      .addEventListener(
        "click",
        toggleDarkMode
      );


    document
      .getElementById("settingsDarkButton")
      .addEventListener(
        "click",
        toggleDarkMode
      );


    document
      .getElementById("notificationButton")
      .addEventListener(
        "click",
        showNotification
      );


    document
      .getElementById("backButton")
      .addEventListener(
        "click",
        () => {

          showPage("home");

        }
      );


    document.addEventListener(
      "click",
      event => {

        const target =
          event.target;

        if (
          !notificationPanel.contains(target) &&
          target.id !== "notificationButton"
        ) {

          notificationPanel.classList.remove(
            "show"
          );

        }

      }
    );


    loadDarkMode();
    loadNews();

  </script>

</body>
</html>
