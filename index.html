<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEWS NOW</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --background: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --sub-text: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --hover: #f3f4f6;
      --shadow: 0 4px 18px rgba(0, 0, 0, 0.07);
    }

    body.dark {
      --background: #111827;
      --card: #1f2937;
      --text: #f9fafb;
      --sub-text: #9ca3af;
      --border: #374151;
      --primary: #60a5fa;
      --primary-light: #1e3a5f;
      --hover: #374151;
      --shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--background);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
      transition:
        background 0.25s ease,
        color 0.25s ease;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .app {
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    .logo span {
      color: var(--primary);
    }

    .header-status {
      color: var(--sub-text);
      font-size: 13px;
    }

    main {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding-top: 28px;
    }

    .page {
      display: block;
    }

    .hidden {
      display: none !important;
    }

    .search-area {
      margin-bottom: 16px;
    }

    .search-box {
      width: 100%;
      height: 48px;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0 16px;
      background: var(--card);
      color: var(--text);
      outline: none;
      box-shadow: var(--shadow);
    }

    .search-box:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .top-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .small-button,
    .secondary-button,
    .primary-button,
    .update-button {
      border: 0;
      border-radius: 10px;
      padding: 10px 15px;
      font-weight: 700;
    }

    .small-button,
    .secondary-button {
      background: var(--hover);
      color: var(--text);
    }

    .primary-button,
    .update-button {
      background: var(--primary);
      color: #ffffff;
    }

    button:hover {
      opacity: 0.88;
    }

    .category-area {
      margin-bottom: 28px;
    }

    .category-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .categories {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .category-button {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 15px;
      font-weight: 700;
    }

    .category-button.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .top-area {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 8px;
    }

    .page-title {
      font-size: 27px;
      font-weight: 900;
    }

    .update-info {
      color: var(--sub-text);
      font-size: 13px;
      margin-bottom: 16px;
    }

    .status {

      border-radius: 12px;
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .news-list,

      display: grid;
      gap: 14px;
    }

    .news-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .news-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
      color: var(--sub-text);
      font-size: 12px;

    .news-category {

    .news-title {

    }

      top: 82px;
      right: 20px;

      border: 1px solid var(--border);

      margin-bottom: 8px;
    }

    .notification-text {
      color: var(--sub-text);
      line-height: 1.6;
      font-size: 14px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 80;
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
    }

    .bottom-nav-inner {
      width: min(600px, calc(100% - 20px));
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;

    .nav-button {

      background: transparent;
      color: var(--sub-text);
      padding: 9px 4px 7px;
      font-size: 12px;
      font-weight: 800;

    }

    .nav-line {
      display: block;
      width: 22px;
      height: 3px;

    .nav-button.active .nav-line {

    }

      margin-right: 10px;

        font-size: 23px;
      }

      }

      .news-title {

      }
    }

    const UNWANTED_PHRASES = [

      "Google ニュースで見出しと意見をもっと見る",
      "Googleニュースで見出しと意見をもっと見る",
      "Google ニュース",

    ];


    function escapeRegExp(value) {

      return String(value)
        .replace(
          /[.*+?^${}()|[\]\\]/g,
          "\\$&"
        );

    }


    function collectSourceNames(item) {

      const names = [
        ...KNOWN_SOURCE_NAMES
      ];

      if (
        item &&
        typeof item === "object"
      ) {

        if (
          typeof item.source === "string" &&
          item.source.trim()
        ) {

          names.push(
            item.source.trim()
          );

        }

        if (
          Array.isArray(item.sources)
        ) {

          item.sources.forEach(
            source => {

              if (
                typeof source === "string" &&
                source.trim()
              ) {

                names.push(
                  source.trim()
                );

              }

              if (
                source &&
                typeof source === "object"
              ) {

                if (
                  typeof source.name === "string" &&
                  source.name.trim()
                ) {

                  names.push(
                    source.name.trim()
                  );

                }

              }

            }
          );

        }

      }

      return [
        ...new Set(
          names
            .map(
              name =>
                String(name).trim()
            )
            .filter(Boolean)
        )
      ];

    }


    function cleanNewsText(
      value,
      sourceNames = []
    ) {

      let text =
        String(value ?? "");


      /*
        HTMLタグを除去
      */

      text =
        text.replace(
          /<[^>]*>/g,
          " "
        );


      /*
        HTMLエンティティを簡易的に除去
      */

      const textarea =
        document.createElement("textarea");

      textarea.innerHTML =
        text;

      text =
        textarea.value;


      /*
        URLを除去
      */

      text =
        text.replace(
          /https?:\/\/[^\s]+/gi,
          " "
        );


      /*
        Googleニュース系の不要文字を除去
      */

      UNWANTED_PHRASES.forEach(
        phrase => {

          text =
            text.replace(
              new RegExp(
                escapeRegExp(phrase),
                "gi"
              ),
              " "
            );

        }
      );


      /*
        取得元名を除去
      */

      const names = [
        ...new Set([
          ...KNOWN_SOURCE_NAMES,
          ...sourceNames
        ])
      ]
        .filter(Boolean)
        .sort(
          (a, b) =>
            b.length - a.length
        );


      names.forEach(
        name => {

          const escaped =
            escapeRegExp(name);


          text =
            text.replace(
              new RegExp(
                `\\s*[-–—|｜]\\s*${escaped}\\s*`,
                "gi"
              ),
              " "
            );


          text =
            text.replace(
              new RegExp(
                `\\s*[（(]\\s*${escaped}\\s*[）)]`,
                "gi"
              ),
              " "
            );


          text =
            text.replace(
              new RegExp(
                `(^|[\\s　])${escaped}(?=$|[\\s　])`,
                "gi"
              ),
              "$1"
            );


          text =
            text.replace(
              new RegExp(
                `${escaped}\\s*$`,
                "gi"
              ),
              ""
            );

        }
      );


      /*
        不要な区切り文字を整理
      */

      text =
        text.replace(
          /\s*[-–—|｜]\s*$/g,
          ""
        );


      text =
        text.replace(
          /^[\s　\-–—|｜]+/g,
          ""
        );


      text =
        text.replace(
          /[\s　\-–—|｜]+$/g,
          ""
        );


      /*
        連続する空白を整理
      */

      text =
        text.replace(
          /[ \t]{2,}/g,
          " "
        );


      text =
        text.replace(
          /　{2,}/g,
          "　"
        );


      /*
        不要な改行を整理
      */

      text =
        text.replace(
          /\n{2,}/g,
          "\n"
        );


      return text.trim();

    }


    /*
      ==========================================
      ニュースデータ正規化
      ==========================================
    */

    function normalizeNewsItem(
      item,
      index
    ) {

      const sourceNames =
        collectSourceNames(item);


      const rawTitle =
        String(
          item.title ||
          "タイトルなし"
        );


      const rawDescription =
        String(
          item.description ||
          ""
        );


      const title =
        cleanNewsText(
          rawTitle,
          sourceNames
        ) ||
        "タイトルなし";


      let description =
        cleanNewsText(
          rawDescription,
          sourceNames
        );


      /*
        説明文の中にタイトルが
        そのまま入っている場合は除去
      */

      if (
        description &&
        title &&
        description.includes(title)
      ) {

        description =
          description
            .replace(
              new RegExp(
                escapeRegExp(title),
                "g"
              ),
              " "
            )
            .trim();

      }


      /*
        説明文に複数の記事タイトルが
       連結されているような場合は表示しない。

        Google News RSSのクラスタ文章対策。
      */

      const suspiciousPatterns = [

        "【",
        "】",
        " [",
        "] ",
        "Googleニュース",
        "Google ニュース",
        "見出しと意見をもっと見る"

      ];


      const suspiciousCount =
        suspiciousPatterns.reduce(
          (count, pattern) =>
            count +
            (
              description.includes(pattern)
                ? 1
                : 0
            ),
          0
        );


      if (
        suspiciousCount >= 1 ||
        description.length > 500
      ) {

        description = "";

      }


      /*
        説明文が短すぎる場合は
        無理に表示しない。
      */

      if (
        description.length < 8
      ) {

        description = "";

      }


      return {

        id:
          String(
            item.id ??
            `${title}-${item.date || index}`
          ),

        title,

        description,

        category:
          String(
            item.category ||
            "国内"
          ),

        date:
          String(
            item.date ||
            ""
          ),

        url:
          String(
            item.url ||
            ""
          )

      };

    }


    /*
      ==========================================
      安全なURL
      ==========================================
    */

    function getSafeURL(url) {

      if (
        typeof url !== "string"
      ) {

        return "";

      }

      const trimmed =
        url.trim();

      if (!trimmed) {

        return "";

      }

      try {

        const parsed =
          new URL(
            trimmed,
            window.location.href
          );

        if (
          parsed.protocol !== "http:" &&
          parsed.protocol !== "https:"
        ) {

          return "";

        }

        return parsed.href;

      } catch (error) {

        return "";

      }

    }

    function saveFavorites() {

      localStorage.setItem(
        "newsNowFavorites",
        JSON.stringify(

            id => String(id)
          )
        )
      );

    }


    function isFavorite(id) {

      return favorites.includes(
        String(id)
      );

    }


    function toggleFavorite(id) {

      const stringId =
        String(id);

      if (
        isFavorite(stringId)
      ) {

        favorites =
          favorites.filter(
            favoriteId =>
              favoriteId !== stringId
          );

      } else {

        favorites.push(
          stringId
        );

      }

      saveFavorites();

      renderNews();
      renderPopular();
      renderFavorites();

    }

      ==========================================
      検索・カテゴリー
      ==========================================

    function getFilteredNews() {

      const keyword =
        searchInput.value
          .trim()
          .toLowerCase();


      let result =
        [...newsData];


      if (
        currentCategory !== "総合"
      ) {

        result =
          result.filter(
            news =>
              String(
                news.category || ""
              ) ===
              currentCategory
          );

      }


      if (keyword) {

        result =
          result.filter(
            news => {

              const text =
                [
                  news.title || "",
                  news.description || "",
                  news.category || ""
                ]
                  .join(" ")
                  .toLowerCase();

              return text.includes(
                keyword
              );

            }
          );

      }


      return result;

    }

              const dateA =
                new Date(
                  a.date || 0
                ).getTime() || 0;

              const dateB =
                new Date(
                  b.date || 0
                ).getTime() || 0;

              return (
                dateB -
                dateA
              );

            }
          )
          .slice(
            0,
            10
          );


      if (
        sorted.length === 0
      ) {

        popularList.innerHTML = `

          </div>

                news.title ||

              const description =
                news.description || "";


              const category =
                news.category ||
                "ニュース";


              const date =
                news.date ||
                "";


              const id =
                String(
                  news.id ?? ""
                );

    /*
      ==========================================
      ニュース読み込み
      ==========================================
    */

    async function loadNews() {

      status.textContent =
        "ニュースを読み込んでいます";


      updateInfo.textContent =
        "最新のnews.jsonを確認しています";


      headerStatus.textContent =
        "ニュースを読み込み中";


      errorArea.innerHTML =
        "";


      try {

        const response =
          await fetch(
            `${NEWS_JSON_URL}?t=${Date.now()}`,
            {
              cache: "no-store"
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            `news.jsonの読み込みに失敗しました（HTTP ${response.status}）`
          );

        }


        const data =
          await response.json();


        if (
          !data ||
          !Array.isArray(
            data.items
          )
        ) {

          throw new Error(
            "news.jsonの形式が正しくありません。items配列が必要です。"
          );

        }


        /*
          source / sourcesは
          画面表示用データには入れません。
        */

        newsData =
          data.items
            .filter(
              item =>
                item &&
                typeof item === "object"
            )
            .map(
              normalizeNewsItem
            );


        renderNews();

        renderPopular();

        renderFavorites();


        const updatedAt =
          data.updatedAt;


        if (
          updatedAt
        ) {

          const date =
            new Date(
              updatedAt
            );


          if (
            !Number.isNaN(
              date.getTime()
            )
          ) {

            updateInfo.textContent =
              `最終更新：${date.toLocaleString(
                "ja-JP"
              )} / 全${newsData.length}件`;

          } else {

            updateInfo.textContent =
              `最終更新：${updatedAt} / 全${newsData.length}件`;

          }

        } else {

          updateInfo.textContent =
            `最終更新：更新時刻を取得できません / 全${newsData.length}件`;

        }


        headerStatus.textContent =
          `${newsData.length}件のニュースを表示中`;


        if (
          newsData.length === 0
        ) {

          status.textContent =
            "news.jsonにはニュースがまだ保存されていません";

        }

      } catch (error) {

        console.error(
          error
        );


        newsData = [];


        renderNews();

        renderPopular();

        renderFavorites();


        status.textContent =
          "ニュースの読み込みに失敗しました";


        updateInfo.textContent =
          "news.jsonを確認してください";


        headerStatus.textContent =
          "ニュースを読み込めませんでした";


        errorArea.innerHTML = `
          <div class="error-box">

            <strong>
              news.jsonを読み込めませんでした
            </strong>

            <br><br>

            ${escapeHTML(
              error.message
            )}

            <br><br>

            GitHubのリポジトリ直下に
            <strong>news.json</strong>
            があるか確認してください。

          </div>
        `;

      }

    }

      ==========================================
    */

    document
      .getElementById(
        "backButton"
      )
      .addEventListener(
        "click",
        () => {

          showPage(
            "home"
          );

        }
      );


    /*
      ==========================================
      通知パネル外クリック
      ==========================================
    */

    document.addEventListener(
      "click",
      event => {

        const target =
          event.target;


        if (
          !notificationPanel.contains(
            target
          ) &&
          target.id !==
            "notificationButton"
        ) {

          notificationPanel.classList.remove(
            "show"
          );

        }

      }
    );


    /*
      ==========================================
      初期化
      ==========================================
    */

    loadDarkMode();

    loadNews();

  </script>

</body>
</html>
