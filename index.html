<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEWS NOW</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --background: #f5f7fb;
      --card: #ffffff;
      --text: #222222;
      --subtext: #777777;
      --header1: #2563eb;
      --header2: #4f46e5;
      --button: #111827;
      --button-hover: #374151;
      --category-bg: #eef2ff;
      --category-text: #3730a3;
      --active: #4f46e5;
      --border: #e5e7eb;
    }

    body.dark {
      --background: #111827;
      --card: #1f2937;
      --text: #f9fafb;
      --subtext: #cbd5e1;
      --header1: #1d4ed8;
      --header2: #4338ca;
      --button: #374151;
      --button-hover: #4b5563;
      --category-bg: #374151;
      --category-text: #e0e7ff;
      --active: #6366f1;
      --border: #374151;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
      background: var(--background);
      color: var(--text);
      transition: 0.3s;
    }

    header {
      background: linear-gradient(
        135deg,
        var(--header1),
        var(--header2)
      );
      color: white;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
    }

    header h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 1px;
    }

    header p {
      margin: 8px 0 0;
      opacity: 0.9;
      font-size: 14px;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .tools {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-box {
      flex: 1;
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 15px;
      background: var(--card);
      color: var(--text);
    }

    .dark-button {
      border: none;
      background: var(--button);
      color: white;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }

    .category-area {
      background: var(--card);
      padding: 15px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
      margin-bottom: 20px;
    }

    .category-title {
      font-weight: bold;
      margin-bottom: 12px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 3px;
    }

    .category-button {
      border: none;
      background: var(--category-bg);
      color: var(--category-text);
      padding: 10px 15px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 14px;
      transition: 0.2s;
    }

    .category-button:hover {
      transform: translateY(-1px);
    }

    .category-button.active {
      background: var(--active);
      color: white;
    }

    .top-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .current-category {
      font-size: 22px;
      font-weight: bold;
    }

    .update-button {
      border: none;
      background: var(--button);
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    .update-button:hover,
    .dark-button:hover {
      background: var(--button-hover);
    }

    .status {
      text-align: center;
      padding: 20px;
      color: var(--subtext);
    }

    .update-info {
      text-align: center;
      font-size: 12px;
      color: var(--subtext);
      margin-bottom: 15px;
    }

    .news-list {
      display: grid;
      gap: 14px;
    }

    .news-card {
      background: var(--card);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
      transition: 0.2s;
    }

    .news-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    }

    .news-card a {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .news-title {
      font-size: 18px;
      font-weight: bold;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .news-info {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--subtext);
      font-size: 13px;
    }

    .source {
      font-weight: bold;
    }

    footer {
      text-align: center;
      color: var(--subtext);
      font-size: 12px;
      padding: 30px 15px;
    }

    @media (max-width: 600px) {
      header {
        padding: 22px 15px;
      }

      header h1 {
        font-size: 27px;
      }

      main {
        padding: 12px;
      }

      .tools {
        flex-direction: column;
      }

      .dark-button {
        width: 100%;
      }

      .top-area {
        align-items: flex-start;
        flex-direction: column;
      }

      .current-category {
        font-size: 20px;
      }

      .update-button {
        width: 100%;
      }

      .news-card {
        padding: 15px;
      }

      .news-title {
        font-size: 16px;
      }

      .news-info {
        flex-direction: column;
        gap: 4px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>NEWS NOW</h1>
    <p>最新ニュースをまとめてチェック</p>
  </header>

  <main>

    <div class="tools">

      <input
        type="text"
        id="searchInput"
        class="search-box"
        placeholder="ニュースを検索..."
      >

      <button
        id="darkModeButton"
        class="dark-button"
      >
        🌙 ダークモード
      </button>

    </div>


    <section class="category-area">

      <div class="category-title">
        ニュースジャンル
      </div>

      <div class="categories">

        <button
          class="category-button active"
          data-category="総合"
        >
          📰 総合
        </button>

        <button
          class="category-button"
          data-category="国内"
        >
          🇯🇵 国内
        </button>

        <button
          class="category-button"
          data-category="海外"
        >
          🌎 海外
        </button>

        <button
          class="category-button"
          data-category="IT"
        >
          💻 IT・テクノロジー
        </button>

        <button
          class="category-button"
          data-category="スポーツ"
        >
          ⚽ スポーツ
        </button>

        <button
          class="category-button"
          data-category="エンタメ"
        >
          🎮 エンタメ
        </button>

        <button
          class="category-button"
          data-category="科学"
        >
          🔬 科学
        </button>

      </div>

    </section>


    <section>

      <div class="top-area">

        <div
          class="current-category"
          id="currentCategory"
        >
          📰 総合ニュース
        </div>

        <button
          class="update-button"
          id="updateButton"
        >
          🔄 ニュースを更新
        </button>

      </div>


      <div
        id="updateInfo"
        class="update-info"
      >
        最新ニュースを読み込んでいます
      </div>


      <div
        id="status"
        class="status"
      >
        ニュースを読み込んでいます...
      </div>


      <div
        id="newsList"
        class="news-list"
      ></div>

    </section>

  </main>


  <footer>
    NEWS NOW
    <br>
    ニュース情報は各ニュース提供元から取得しています。
  </footer>


  <script>

    const newsList =
      document.getElementById("newsList");

    const status =
      document.getElementById("status");

    const currentCategory =
      document.getElementById("currentCategory");

    const updateButton =
      document.getElementById("updateButton");

    const searchInput =
      document.getElementById("searchInput");

    const darkModeButton =
      document.getElementById("darkModeButton");

    const updateInfo =
      document.getElementById("updateInfo");

    const categoryButtons =
      document.querySelectorAll(
        ".category-button"
      );


    let currentCategoryName =
      "総合";

    let allNewsItems = [];


    const feeds = {

      "総合":
        "https://news.google.com/rss?hl=ja&gl=JP&ceid=JP:ja",

      "国内":
        "https://news.google.com/rss/search?q=%E6%97%A5%E6%9C%AC&hl=ja&gl=JP&ceid=JP:ja",

      "海外":
        "https://news.google.com/rss/search?q=%E6%B5%B7%E5%A4%96&hl=ja&gl=JP&ceid=JP:ja",

      "IT":
        "https://news.google.com/rss/search?q=IT+%E3%83%86%E3%82%AF%E3%83%8E%E3%83%AD%E3%82%B8%E3%83%BC&hl=ja&gl=JP&ceid=JP:ja",

      "スポーツ":
        "https://news.google.com/rss/search?q=%E3%82%B9%E3%83%9D%E3%83%BC%E3%83%84&hl=ja&gl=JP&ceid=JP:ja",

      "エンタメ":
        "https://news.google.com/rss/search?q=%E3%82%A8%E3%83%B3%E3%82%BF%E3%83%A1&hl=ja&gl=JP&ceid=JP:ja",

      "科学":
        "https://news.google.com/rss/search?q=%E7%A7%91%E5%AD%A6&hl=ja&gl=JP&ceid=JP:ja"

    };


    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }


    function formatDate(dateText) {

      const date =
        new Date(dateText);

      if (isNaN(date.getTime())) {

        return dateText;

      }

      const now =
        new Date();

      const difference =
        Math.floor(
          (now - date) / 1000
        );


      if (difference < 60) {

        return "たった今";

      }

      if (difference < 3600) {

        return Math.floor(
          difference / 60
        ) + "分前";

      }

      if (difference < 86400) {

        return Math.floor(
          difference / 3600
        ) + "時間前";

      }

      return date.toLocaleDateString(
        "ja-JP"
      );

    }


    function displayNews(items) {

      newsList.innerHTML = "";


      if (items.length === 0) {

        status.style.display =
          "block";

        status.textContent =
          "該当するニュースが見つかりませんでした。";

        return;

      }


      status.style.display =
        "none";


      items.forEach((news) => {

        const card =
          document.createElement("article");

        card.className =
          "news-card";


        card.innerHTML = `
          <a
            href="${escapeHtml(news.link)}"
            target="_blank"
            rel="noopener noreferrer"
          >

            <div class="news-title">
              ${escapeHtml(news.title)}
            </div>

            <div class="news-info">

              <span class="source">
                ${escapeHtml(news.source)}
              </span>

              <span>
                ${escapeHtml(
                  formatDate(news.pubDate)
                )}
              </span>

            </div>

          </a>
        `;


        newsList.appendChild(
          card
        );

      });

    }


    async function loadNews() {

      newsList.innerHTML =
        "";

      status.style.display =
        "block";

      status.textContent =
        "ニュースを読み込んでいます...";


      try {

        const rssUrl =
          feeds[currentCategoryName];


        const proxyUrl =
          "https://api.allorigins.win/raw?url=" +
          encodeURIComponent(
            rssUrl
          );


        const response =
          await fetch(proxyUrl);


        if (!response.ok) {

          throw new Error(
            "ニュース取得エラー"
          );

        }


        const xmlText =
          await response.text();


        const parser =
          new DOMParser();


        const xml =
          parser.parseFromString(
            xmlText,
            "application/xml"
          );


        const items =
          Array.from(
            xml.querySelectorAll(
              "item"
            )
          ).slice(0, 30);


        if (
          items.length === 0
        ) {

          throw new Error(
            "ニュースがありません"
          );

        }


        allNewsItems =
          items.map((item) => {

            return {

              title:
                item
                  .querySelector(
                    "title"
                  )
                  ?.textContent
                  ?.trim()
                  || "タイトルなし",

              link:
                item
                  .querySelector(
                    "link"
                  )
                  ?.textContent
                  ?.trim()
                  || "#",

              pubDate:
                item
                  .querySelector(
                    "pubDate"
                  )
                  ?.textContent
                  ?.trim()
                  || "",

              source:
                item
                  .querySelector(
                    "source"
                  )
                  ?.textContent
                  ?.trim()
                  || "ニュース"

            };

          });


        displayNews(
          allNewsItems
        );


        const now =
          new Date();


        updateInfo.textContent =
          "最終更新：" +
          now.toLocaleTimeString(
            "ja-JP",
            {
              hour:
                "2-digit",

              minute:
                "2-digit"

            }
          );


      } catch (error) {

        console.error(
          error
        );


        status.style.display =
          "block";


        status.textContent =
          "ニュースの取得に失敗しました。時間をおいてもう一度お試しください。";

      }

    }


    categoryButtons.forEach(
      (button) => {

        button.addEventListener(
          "click",
          () => {

            categoryButtons.forEach(
              (btn) => {

                btn.classList.remove(
                  "active"
                );

              }
            );


            button.classList.add(
              "active"
            );


            currentCategoryName =
              button.dataset.category;


            const emojiMap = {

              "総合":
                "📰",

              "国内":
                "🇯🇵",

              "海外":
                "🌎",

              "IT":
                "💻",

              "スポーツ":
                "⚽",

              "エンタメ":
                "🎮",

              "科学":
                "🔬"

            };


            const categoryNames = {

              "総合":
                "総合",

              "国内":
                "国内",

              "海外":
                "海外",

              "IT":
                "IT・テクノロジー",

              "スポーツ":
                "スポーツ",

              "エンタメ":
                "エンタメ",

              "科学":
                "科学"

            };


            currentCategory.textContent =
              emojiMap[
                currentCategoryName
              ] +
              " " +
              categoryNames[
                currentCategoryName
              ] +
              "ニュース";


            searchInput.value =
              "";


            loadNews();

          }
        );

      }
    );


    updateButton.addEventListener(
      "click",
      loadNews
    );


    searchInput.addEventListener(
      "input",
      () => {

        const keyword =
          searchInput.value
            .toLowerCase()
            .trim();


        const filtered =
          allNewsItems.filter(
            (news) => {

              return (
                news.title
                  .toLowerCase()
                  .includes(
                    keyword
                  )
                ||
                news.source
                  .toLowerCase()
                  .includes(
                    keyword
                  )
              );

            }
          );


        displayNews(
          filtered
        );

      }
    );


    darkModeButton.addEventListener(
      "click",
      () => {

        document.body.classList.toggle(
          "dark"
        );


        if (
          document.body.classList.contains(
            "dark"
          )
        ) {

          darkModeButton.textContent =
            "☀️ ライトモード";

        } else {

          darkModeButton.textContent =
            "🌙 ダークモード";

        }

      }
    );


    /*
      10分ごとに自動更新
    */

    setInterval(
      loadNews,
      600000
    );


    /*
      最初のニュースを取得
    */

    loadNews();

  </script>

</body>
</html>
