<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEWS NOW</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --background: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --subtext: #6b7280;
      --primary: #2563eb;
      --header2: #4f46e5;
      --border: #e5e7eb;
      --soft: #eef2ff;
      --shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    body.dark {
      --background: #111827;
      --card: #1f2937;
      --text: #f9fafb;
      --subtext: #cbd5e1;
      --primary: #60a5fa;
      --header2: #6366f1;
      --border: #374151;
      --soft: #273449;
      --shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
      background: var(--background);
      color: var(--text);
      transition: 0.25s;
      padding-bottom: 80px;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    header {
      background: linear-gradient(
        135deg,
        var(--primary),
        var(--header2)
      );
      color: white;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
    }

    header h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 1px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .hidden {
      display: none !important;
    }

    .search-area {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .search-box {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--primary);
    }

    .top-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .small-button {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 14px;
    }

    .small-button:hover {
      border-color: var(--primary);
    }

    .category-area {
      background: var(--card);
      padding: 15px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .category-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 3px;
    }

    .category-button {
      border: none;
      background: var(--soft);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 999px;
      white-space: nowrap;
      font-size: 14px;
      transition: 0.2s;
    }

    .category-button.active {
      background: var(--primary);
      color: white;
    }

    .top-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .page-title {
      font-size: 23px;
      font-weight: bold;
    }

    .update-button {
      border: none;
      background: var(--text);
      color: var(--card);
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 14px;
    }

    .update-button:hover {
      opacity: 0.85;
    }

    .update-info {
      text-align: center;
      font-size: 12px;
      color: var(--subtext);
      margin-bottom: 15px;
    }

    .status {
      text-align: center;
      padding: 30px 15px;
      color: var(--subtext);
    }

    .news-list {
      display: grid;
      gap: 14px;
    }

    .news-card {
      position: relative;
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--shadow);
      transition: 0.2s;
      border: 1px solid transparent;
    }

    .news-card:hover {
      transform: translateY(-2px);
      border-color: var(--border);
    }

    .news-card-link {
      display: block;
      cursor: pointer;
      padding-right: 70px;
    }

    .news-title {
      font-size: 18px;
      font-weight: bold;
      line-height: 1.55;
      margin-bottom: 12px;
    }

    .news-info {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--subtext);
      font-size: 13px;
    }

    .source {
      font-weight: bold;
    }

    .favorite-button {
      position: absolute;
      right: 14px;
      top: 14px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
    }

    .favorite-button.active {
      color: var(--primary);
      border-color: var(--primary);
    }

    .popular-area {
      margin-top: 20px;
    }

    .popular-card {
      background: var(--card);
      border-radius: 14px;
      padding: 15px;
      box-shadow: var(--shadow);
      margin-bottom: 10px;
      cursor: pointer;
    }

    .popular-number {
      color: var(--primary);
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .popular-title {
      font-weight: bold;
      line-height: 1.5;
    }

    .detail-card {
      background: var(--card);
      border-radius: 18px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .detail-title {
      font-size: 25px;
      line-height: 1.5;
      margin: 0 0 20px;
    }

    .detail-info {
      color: var(--subtext);
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    .detail-description {
      line-height: 1.8;
      margin-bottom: 25px;
    }

    .detail-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .primary-button {
      display: inline-block;
      border: none;
      background: var(--primary);
      color: white;
      padding: 13px 18px;
      border-radius: 10px;
      font-size: 14px;
      text-decoration: none;
    }

    .secondary-button {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 13px 18px;
      border-radius: 10px;
      font-size: 14px;
    }

    .empty {
      text-align: center;
      padding: 45px 15px;
      color: var(--subtext);
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 70px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: center;
      z-index: 100;
      box-shadow: 0 -3px 12px rgba(0, 0, 0, 0.06);
    }

    .bottom-nav-inner {
      width: 100%;
      max-width: 700px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .nav-button {
      border: none;
      background: transparent;
      color: var(--subtext);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .nav-button.active {
      color: var(--primary);
      font-weight: bold;
    }

    .nav-line {
      width: 24px;
      height: 2px;
      background: currentColor;
      border-radius: 10px;
    }

    footer {
      text-align: center;
      color: var(--subtext);
      font-size: 12px;
      padding: 30px 15px 15px;
    }

    .notification {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%) translateY(-120px);
      width: calc(100% - 30px);
      max-width: 500px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      z-index: 200;
      transition: 0.3s;
    }

    .notification.show {
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 600px) {
      header {
        padding: 22px 15px;
      }

      header h1 {
        font-size: 27px;
      }

      main {
        padding: 12px;
      }

      .top-area {
        align-items: stretch;
        flex-direction: column;
      }

      .update-button {
        width: 100%;
      }

      .news-title {
        font-size: 16px;
      }

      .news-info {
        flex-direction: column;
        gap: 4px;
      }

      .detail-title {
        font-size: 21px;
      }
    }
  </style>

</head>

  <script>

    const newsList =
      document.getElementById("newsList");

    const favoritesList =
      document.getElementById("favoritesList");

    const popularList =
      document.getElementById("popularList");

    const status =
      document.getElementById("status");

    const currentCategory =
      document.getElementById("currentCategory");

    const updateButton =
      document.getElementById("updateButton");

    const searchInput =
      document.getElementById("searchInput");

    const darkModeButton =
      document.getElementById("darkModeButton");

    const settingsDarkButton =
      document.getElementById("settingsDarkButton");

    const notificationButton =
      document.getElementById("notificationButton");

    const notification =
      document.getElementById("notification");

    const updateInfo =
      document.getElementById("updateInfo");

    const detailContent =
      document.getElementById("detailContent");

    const backButton =
      document.getElementById("backButton");


    const homePage =
      document.getElementById("homePage");

    const popularPage =
      document.getElementById("popularPage");

    const favoritesPage =
      document.getElementById("favoritesPage");

    const detailPage =
      document.getElementById("detailPage");

    const settingsPage =
      document.getElementById("settingsPage");


    const categoryButtons =
      document.querySelectorAll(
        ".category-button"
      );

    const navButtons =
      document.querySelectorAll(
        ".nav-button"
      );


    let currentCategoryName = "総合";

    let allNewsItems = [];

    let favorites =
      JSON.parse(
        localStorage.getItem(
          "newsNowFavorites"
        ) || "[]"
      );


    const feeds = {

      "総合":
        "https://news.google.com/rss?hl=ja&gl=JP&ceid=JP:ja",

      "国内":
        "https://news.google.com/rss/search?q=%E6%97%A5%E6%9C%AC&hl=ja&gl=JP&ceid=JP:ja",

      "海外":
        "https://news.google.com/rss/search?q=%E6%B5%B7%E5%A4%96&hl=ja&gl=JP&ceid=JP:ja",

      "IT":
        "https://news.google.com/rss/search?q=IT+%E3%83%86%E3%82%AF%E3%83%8E%E3%83%AD%E3%82%B8%E3%83%BC&hl=ja&gl=JP&ceid=JP:ja",

      "スポーツ":
        "https://news.google.com/rss/search?q=%E3%82%B9%E3%83%9D%E3%83%BC%E3%83%84&hl=ja&gl=JP&ceid=JP:ja",

      "エンタメ":
        "https://news.google.com/rss/search?q=%E3%82%A8%E3%83%B3%E3%82%BF%E3%83%A1&hl=ja&gl=JP&ceid=JP:ja",

      "科学":
        "https://news.google.com/rss/search?q=%E7%A7%91%E5%AD%A6&hl=ja&gl=JP&ceid=JP:ja"

    };


    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text || "";

      return div.innerHTML;

    }


    function formatDate(dateText) {

      const date =
        new Date(dateText);

      if (isNaN(date.getTime())) {
        return dateText || "";
      }

      const now =
        new Date();

      const difference =
        Math.floor(
          (now - date) / 1000
        );

      if (difference < 60) {
        return "たった今";
      }

      if (difference < 3600) {
        return (
          Math.floor(
            difference / 60
          ) + "分前"
        );
      }

      if (difference < 86400) {
        return (
          Math.floor(
            difference / 3600
          ) + "時間前"
        );
      }

      return date.toLocaleDateString(
        "ja-JP"
      );

    }


    function isFavorite(news) {

      return favorites.some(
        (favorite) =>
          favorite.link === news.link
      );

    }


    function saveFavorites() {

      localStorage.setItem(
        "newsNowFavorites",
        JSON.stringify(favorites)
      );

    }


    function toggleFavorite(news) {

      if (isFavorite(news)) {

        favorites =
          favorites.filter(
            (favorite) =>
              favorite.link !== news.link
          );

      } else {

        favorites.push(news);

      }

      saveFavorites();

      renderFavorites();

      displayNews(
        getFilteredNews()
      );

    }


    function createNewsCard(news) {

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "news-card";

      const favorite =
        isFavorite(news);


      card.innerHTML = `

        <button
          class="favorite-button ${
            favorite
              ? "active"
              : ""
          }"
        >
          ${
            favorite
              ? "保存済み"
              : "保存"
          }
        </button>

        <div
          class="news-card-link"
        >

          <div class="news-title">
            ${escapeHtml(news.title)}
          </div>

          <div class="news-info">

            <span class="source">
              ${escapeHtml(news.source)}
            </span>

            <span>
              ${escapeHtml(
                formatDate(
                  news.pubDate
                )
              )}
            </span>

          </div>

        </div>

      `;


      const favoriteButton =
        card.querySelector(
          ".favorite-button"
        );


      favoriteButton.addEventListener(
        "click",
        (event) => {

          event.stopPropagation();

          toggleFavorite(news);

        }
      );


      const newsLink =
        card.querySelector(
          ".news-card-link"
        );


      newsLink.addEventListener(
        "click",
        () => {
          openDetail(news);
        }
      );


      return card;

    }


    function displayNews(items) {

      newsList.innerHTML = "";

      if (items.length === 0) {

        status.style.display =
          "block";

        status.textContent =
          "該当するニュースが見つかりませんでした。";

        return;

      }

      status.style.display =
        "none";


      items.forEach(
        (news) => {

          newsList.appendChild(
            createNewsCard(news)
          );

        }
      );

    }


    function getFilteredNews() {

      const keyword =
        searchInput.value
          .toLowerCase()
          .trim();

      if (keyword === "") {
        return allNewsItems;
      }

      return allNewsItems.filter(
        (news) => {

          return (
            news.title
              .toLowerCase()
              .includes(keyword)
            ||
            news.source
              .toLowerCase()
              .includes(keyword)
          );

        }
      );

    }


    function renderFavorites() {

      favoritesList.innerHTML = "";

      if (favorites.length === 0) {

        favoritesList.innerHTML = `
          <div class="empty">
            保存したニュースはまだありません。
          </div>
        `;

        return;

      }


      favorites
        .slice()
        .reverse()
        .forEach(
          (news) => {

            favoritesList.appendChild(
              createNewsCard(news)
            );

          }
        );

    }


    function renderPopular() {

      popularList.innerHTML = "";

      if (allNewsItems.length === 0) {

        popularList.innerHTML = `
          <div class="empty">
            ニュースを読み込むと注目ニュースが表示されます。
          </div>
        `;

        return;

      }


      allNewsItems
        .slice(0, 10)
        .forEach(
          (news, index) => {

            const card =
              document.createElement("div");

            card.className =
              "popular-card";


            card.innerHTML = `

              <div class="popular-number">
                RANK ${index + 1}
              </div>

              <div class="popular-title">
                ${escapeHtml(news.title)}
              </div>

            `;


            card.addEventListener(
              "click",
              () => {
                openDetail(news);
              }
            );


            popularList.appendChild(card);

          }
        );

    }


    function openDetail(news) {

      showPage("detail");


      detailContent.innerHTML = `

        <h2 class="detail-title">
          ${escapeHtml(news.title)}
        </h2>

        <div class="detail-info">

          情報元：
          ${escapeHtml(news.source)}

          <br>

          公開：
          ${escapeHtml(
            formatDate(
              news.pubDate
            )
          )}

        </div>

        <div class="detail-description">

          詳しいニュース内容は、
          元の記事ページで確認してください。

        </div>

        <div class="detail-buttons">

          <a
            href="${escapeHtml(news.link)}"
            target="_blank"
            rel="noopener noreferrer"
            class="primary-button"
          >
            元の記事を読む
          </a>

          <button
            id="detailFavoriteButton"
            class="secondary-button"
          >
            ${
              isFavorite(news)
                ? "お気に入りから削除"
                : "お気に入りに保存"
            }
          </button>

        </div>

      `;


      document
        .getElementById(
          "detailFavoriteButton"
        )
        .addEventListener(
          "click",
          () => {

            toggleFavorite(news);

            openDetail(news);

          }
        );

    }


    function showPage(page) {

      homePage.classList.add("hidden");
      popularPage.classList.add("hidden");
      favoritesPage.classList.add("hidden");
      detailPage.classList.add("hidden");
      settingsPage.classList.add("hidden");


      if (page === "home") {

        homePage.classList.remove(
          "hidden"
        );

      }


      if (page === "popular") {

        popularPage.classList.remove(
          "hidden"
        );

        renderPopular();

      }


      if (page === "favorites") {

        favoritesPage.classList.remove(
          "hidden"
        );

        renderFavorites();

      }


      if (page === "detail") {

        detailPage.classList.remove(
          "hidden"
        );

      }


      if (page === "settings") {

        settingsPage.classList.remove(
          "hidden"
        );

      }


      navButtons.forEach(
        (button) => {
          button.classList.remove("active");
        }
      );


      const activeButton =
        document.querySelector(
          `.nav-button[data-page="${page}"]`
        );


      if (activeButton) {
        activeButton.classList.add(
          "active"
        );
      }


      window.scrollTo(0, 0);

    }


    function showNotification(message) {

      notification.textContent =
        message;

      notification.classList.add(
        "show"
      );


      setTimeout(
        () => {

          notification.classList.remove(
            "show"
          );

        },
        4000
      );

    }


    async function fetchWithProxies(rssUrl) {

      const proxyUrls = [

        "https://api.allorigins.win/raw?url=" +
          encodeURIComponent(rssUrl),

        "https://api.codetabs.com/v1/proxy/?quest=" +
          encodeURIComponent(rssUrl)

      ];


      let lastError;


      for (
        const proxyUrl of proxyUrls
      ) {

        try {

          const response =
            await fetch(
              proxyUrl,
              {
                cache: "no-store"
              }
            );


          if (!response.ok) {
            throw new Error(
              "HTTP " +
              response.status
            );
          }


          const text =
            await response.text();


          if (
            !text ||
            text.length < 50
          ) {
            throw new Error(
              "データが空です"
            );
          }


          return text;

        } catch (error) {

          lastError = error;

        }

      }


      throw lastError ||
        new Error(
          "ニュースを取得できませんでした"
        );

    }


    async function loadNews() {

      newsList.innerHTML = "";

      status.style.display =
        "block";

      status.textContent =
        "ニュースを読み込んでいます";


      updateInfo.textContent =
        "ニュースを取得しています";


      try {

        const rssUrl =
          feeds[
            currentCategoryName
          ];


        const xmlText =
          await fetchWithProxies(
            rssUrl
          );


        const parser =
          new DOMParser();


        const xml =
          parser.parseFromString(
            xmlText,
            "application/xml"
          );


        const parseError =
          xml.querySelector(
            "parsererror"
          );


        if (parseError) {

          throw new Error(
            "RSSの解析に失敗しました"
          );

        }


        const items =
          Array.from(
            xml.querySelectorAll(
              "item"
            )
          )
          .slice(0, 30);


        if (items.length === 0) {

          throw new Error(
            "ニュースがありません"
          );

        }


        allNewsItems =
          items.map(
            (item) => {

              return {

                title:
                  item
                    .querySelector(
                      "title"
                    )
                    ?.textContent
                    ?.trim()
                    || "タイトルなし",

                link:
                  item
                    .querySelector(
                      "link"
                    )
                    ?.textContent
                    ?.trim()
                    || "#",

                pubDate:
                  item
                    .querySelector(
                      "pubDate"
                    )
                    ?.textContent
                    ?.trim()
                    || "",

                source:
                  item
                    .querySelector(
                      "source"
                    )
                    ?.textContent
                    ?.trim()
                    || "ニュース"

              };

            }
          );


        displayNews(
          getFilteredNews()
        );


        renderPopular();


        const now =
          new Date();


        updateInfo.textContent =
          "最終更新：" +
          now.toLocaleTimeString(
            "ja-JP",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );


      } catch (error) {

        console.error(error);


        status.style.display =
          "block";


        status.textContent =
          "ニュースを取得できませんでした。時間をおいて更新してください。";


        updateInfo.textContent =
          "データ取得に失敗しました";

      }

    }


    categoryButtons.forEach(
      (button) => {

        button.addEventListener(
          "click",
          () => {

            categoryButtons.forEach(
              (btn) => {
                btn.classList.remove(
                  "active"
                );
              }
            );


            button.classList.add(
              "active"
            );


            currentCategoryName =
              button.dataset.category;


            const categoryNames = {

              "総合":
                "総合ニュース",

              "国内":
                "国内ニュース",

              "海外":
                "海外ニュース",

              "IT":
                "IT・テクノロジー",

              "スポーツ":
                "スポーツニュース",

              "エンタメ":
                "エンタメニュース",

              "科学":
                "科学ニュース"

            };


            currentCategory.textContent =
              categoryNames[
                currentCategoryName
              ];


            searchInput.value = "";


            loadNews();

          }
        );

      }
    );


    updateButton.addEventListener(
      "click",
      () => {

        showNotification(
          "ニュースを更新しています"
        );

        loadNews();

      }
    );


    searchInput.addEventListener(
      "input",
      () => {

        displayNews(
          getFilteredNews()
        );

      }
    );


    function toggleDarkMode() {

      document.body.classList.toggle(
        "dark"
      );


      const isDark =
        document.body.classList.contains(
          "dark"
        );


      localStorage.setItem(
        "newsNowDarkMode",
        isDark
          ? "true"
          : "false"
      );


      darkModeButton.textContent =
        isDark
          ? "ライトモード"
          : "ダークモード";

    }


    darkModeButton.addEventListener(
      "click",
      toggleDarkMode
    );


    settingsDarkButton.addEventListener(
      "click",
      toggleDarkMode
    );


    if (
      localStorage.getItem(
        "newsNowDarkMode"
      ) === "true"
    ) {

      document.body.classList.add(
        "dark"
      );


      darkModeButton.textContent =
        "ライトモード";

    }


    notificationButton.addEventListener(
      "click",
      () => {

        showNotification(
          "現在、新しいニュースを確認できます。"
        );

      }
    );


    navButtons.forEach(
      (button) => {

        button.addEventListener(
          "click",
          () => {

            showPage(
              button.dataset.page
            );

          }
        );

      }
    );


    backButton.addEventListener(
      "click",
      () => {

        showPage("home");

      }
    );


    setInterval(
      () => {

        loadNews();

      },
      600000
    );


    loadNews();

  </script>
